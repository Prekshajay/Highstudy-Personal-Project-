{% extends "base.html" %}

{% block title %}HighStudy - Timer{% endblock %}

{% block extra_styles %}
<style>
  body { justify-content: center; }
  h1 { font-size: 32px; color: #a78bfa; margin-bottom: 6px; }
  .mode-label { color: #c4b5fd; font-size: 16px; margin-bottom: 30px; }
  .timer-circle {
    background: #16213e;
    border: 5px solid #7c3aed;
    border-radius: 50%;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: bold;
    color: #e2d9f3;
    margin-bottom: 30px;
  }
  .buttons { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 12px 28px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; color: white; }
  .btn-start { background: #7c3aed; }
  .btn-pause { background: #0f6e56; }
  .btn-reset { background: #993556; }
  .btn:hover { opacity: 0.85; }
  .break-msg { color: #5dcaa5; font-size: 15px; margin-bottom: 20px; min-height: 22px; text-align: center; max-width: 400px; }
  .sessions { color: #a78bfa; font-size: 14px; margin-bottom: 30px; }
</style>
{% endblock %}

{% block content %}
  <h1>Pomodoro Timer</h1>
  <div class="mode-label" id="mode-label">Focus Mode — 25 minutes</div>

  <div class="timer-circle" id="timer-display">25:00</div>

  <div class="buttons">
    <button class="btn btn-start" onclick="startTimer()">Start</button>
    <button class="btn btn-pause" onclick="pauseTimer()">Pause</button>
    <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
  </div>

  <div class="break-msg" id="break-msg"></div>
  <div class="sessions" id="sessions">Sessions completed: 0</div>

  <a href="/" class="back">← Back to home</a>

  <script>
    const FOCUS_TIME = 25 * 60;
    const BREAK_TIME = 5 * 60;
    let timeLeft = FOCUS_TIME;
    let isBreak = false;
    let interval = null;
    let sessionCount = 0;

    function updateDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const s = String(timeLeft % 60).padStart(2, "0");
      document.getElementById("timer-display").textContent = m + ":" + s;
    }

    function startTimer() {
      if (interval) return;
      interval = setInterval(() => {
        timeLeft--;
        updateDisplay();
        if (timeLeft <= 0) {
          clearInterval(interval);
          interval = null;
          if (!isBreak) {
            sessionCount++;
            document.getElementById("sessions").textContent = "Sessions completed: " + sessionCount;
            isBreak = true;
            timeLeft = BREAK_TIME;
            document.getElementById("mode-label").textContent = "Break Time — 5 minutes";
            document.getElementById("break-msg").textContent = "Great work! Take a 5-minute break. Stretch, drink water, breathe.";
          } else {
            isBreak = false;
            timeLeft = FOCUS_TIME;
            document.getElementById("mode-label").textContent = "Focus Mode — 25 minutes";
            document.getElementById("break-msg").textContent = "Break over! Let's get back to it.";
          }
          startTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(interval);
      interval = null;
    }

    function resetTimer() {
      clearInterval(interval);
      interval = null;
      isBreak = false;
      timeLeft = FOCUS_TIME;
      document.getElementById("mode-label").textContent = "Focus Mode — 25 minutes";
      document.getElementById("break-msg").textContent = "";
      document.getElementById("sessions").textContent = "Sessions completed: " + sessionCount;
      updateDisplay();
    }
  </script>
{% endblock %}
